[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bandcamp-grabber"
version = "0.1.0"
description = "Скачивает альбомы с Bandcamp и встраивает обложку в ID3-теги аудиофайлов"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wtxmnstr" }]
dependencies = [
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "mutagen>=1.47",
    "brotli>=1.1",
]

[project.scripts]
bandcamp-grabber = "bandcamp_grabber.cli:main"

[project.urls]
Homepage = "https://github.com/wtxmnstr/bandcamp-grabber"